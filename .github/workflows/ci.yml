name: CI

#everytime we push into these branches it will run the tester
on:
  push:
    branches: [main, Chong-Li-Heng-2603072,Add-MySQL-storage-for-saved-meal-plans---2605789,Update-Saved-Meal-Plans-with-MySQL-database-integration---2605789,angelica---2605789,nrjbms-comments]
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest
    
    #list down all the needed variables like database
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: justeat
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    #list down database details
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: justeat

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      #installing dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      #loads the database
      - name: Load database schema
        run: mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -prootpass justeat < init_db/schema.sql

      #runs the testcases from automated_text_case.py
      - name: Run tests
        run: python main_test_case/automated_test_case.py